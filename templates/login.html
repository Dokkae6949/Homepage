<!DOCTYPE html>
<html lang="{{ language }}" dir="{{ dir }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ "app-title" | t(language) }}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://unpkg.com/htmx.org@2.0.0"></script>
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-card">
            <h1>{{ "login-title" | t(language) }}</h1>
            <p class="subtitle">{{ "login-prompt" | t(language) }}</p>
            
            <form hx-post="/login" hx-target="body" hx-swap="outerHTML">
                <div class="form-group">
                    <label for="username">{{ "username-label" | t(language) }}</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        placeholder="{{ "username-placeholder" | t(language) }}"
                        required
                        minlength="3"
                        maxlength="50"
                        autofocus
                    >
                </div>
                
                <div class="form-group">
                    <label for="language">{{ "language-label" | t(language) }}</label>
                    <select id="language" name="language">
                        {% for lang in languages %}
                        <option value="{{ lang }}" {% if lang == language %}selected{% endif %}>
                            {% if lang == "en" %}English{% elif lang == "de" %}Deutsch{% endif %}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                
                <button type="submit" class="btn btn-primary">
                    {{ "join-button" | t(language) }}
                </button>
            </form>
        </div>
    </div>
</body>
</html>
